<!DOCTYPE html>
<html lang="es">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>UAgenda</title>
      <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500&display=swap" rel="stylesheet">
      <link rel="stylesheet" href="{{url_for('static', filename='styles/recuperacionStyle.css')}}">
      <link rel="icon" href="{{url_for('static', filename='img/UAgendaIcon.ico')}}">
      <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/0.5.0-beta4/html2canvas.min.js"></script>
   </head>
   <body>

    <div id="MAINCONTAINER">

        <img id="BANNER" src="static/img/UAgenda.png">
        <div id="PASSWORDCONTAINER">
            <h1>RECUPERACIÓN</h1>
            <p>Ingresa el e-mail con el que creaste tu cuenta y recibirás un enlace de recuperación.</p>
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="custom-message-box">
                        <ul>
                            {% for message in messages %}
                                <li>{{ message }}</li>
                            {% endfor %}
                        </ul>
                    </div>
                {% endif %}
            {% endwith %}

            <form method="POST" action="/recuperacion">
                <input type="email" name="recipient" id="exampleInputEmail1" aria-describedby="emailHelp"  name="txtEmail" placeholder="Correo electrónico" required="required" />
                <button type="submit" class="btn btn-primary btn-block btn-large" id="SENDBUTTON">ENVIAR</button>
            </form>

            <a href="/">&#10229; Volver</a> 
        </div>

    </div>

   </body>
</html>
