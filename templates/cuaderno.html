<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuaderno</title>
    <link rel="icon" href="{{url_for('static', filename='img/UAgendaIcon.ico')}}">
    <link rel="stylesheet" href="{{url_for('static', filename='styles/cuaderno.css')}}">
    <script src="https://cdn.tiny.cloud/1/cyo40kyuazintmua0qe935k28ieyfp6y2rxnqthey7zgklrw/tinymce/6/tinymce.min.js" referrerpolicy="origin"></script>
</head>
<body>
    <div id="MAINCONTAINER">

         <div id="SIDEBARCONTAINER">

            <div id="SIDEBAR">

               <a href = "admin" id="MAINMENUA">
                  <img src="static/img/UAgenda2.png" href = "admin" id="MAINMENUIMG">
               </a>

               <a href = "admin" class="OPTION">
                  <div class="UNSELECTEDOPTION">
                     <img src="static/img/mainMenuIcon2.png" class="ICON">
                     <p>Menú Principal</p>
                  </div>
               </a>
               <a href = "schedule" class="OPTION">
                  <div class="UNSELECTEDOPTION">
                     <img src="static/img/scheduleIcon2.png" class="ICON">
                     <p>Horario</p>
                  </div>
               </a>
               <a href = "calculator" class="OPTION">
                  <div class="UNSELECTEDOPTION">
                     <img src="static/img/calculatorIcon2.png" class="ICON">
                     <p>Calculadora de Promedios</p>
                  </div>
               </a>
               <a href = "cuaderno" class="OPTION">
                  <div class="SELECTEDOPTION">
                     <img src="static/img/notebookIcon.png" class="ICON">
                     <p>Mis Apuntes</p>
                  </div>
               </a>
               <a href = "flashcards" class="OPTION">
                  <div class="UNSELECTEDOPTION">
                     <img src="static/img/flashcardsIcon2.png" class="ICON">
                     <p>Tarjetas de Estudio</p>
                  </div>
               </a>

               <div id="SEPARATOR"></div>

               <form action = "logout" id="FORMLOGOUT" method="post">
                  <button type="submit" id="LOGOUTBUTTON">
                     <img src="static/img/logOutIcon.png" class="ICON2">
                     <p>Cerrar Sesión</p>
                  </button>
               </form>

            </div>

         </div>

        <div class="contentContainer">

            <div class="welcomeText">
                <h1 id="encabezado-nombre">{{cuaderno["nombreCuaderno"]}}</h1>
            </div>
            <div id="id-cuaderno">
                {{cuaderno["id_cuaderno"]}}
            </div>

            <div class="notebook">
                <form method="post" id="notebookForm">
                    <textarea id="mytextarea">{{cuaderno["contenido"]}}</textarea>
                </form>
                <div class="justify">
                    <div class="buttons">
                        <div class="info" id="info-user">Cuadro de dialogo</div>

                        <button class="btn btn-nuevo" id="btnNuevoCuaderno" type="button" onclick="mostrarVentana('newNotebookWindow')">
                            <img class="btnIcon" src="{{url_for('static', filename='img/icons/nuevoCuadernoIcon.png')}}" alt="">
                            Nuevo Cuaderno
                        </button>
                        <button class="btn btn-cambiar" id="btnCambiarCuaderno" type="button">
                            <img class="btnIcon" src="{{url_for('static', filename='img/icons/cambiarCuadernoIcon.png')}}" alt="">
                            Cambiar Cuaderno
                        </button>
                        <button class="btn btn-eliminar" type="button">
                            <img class="btnIcon" src="{{url_for('static', filename='img/icons/eliminarCuadernoIcon.png')}}" alt="">
                            Eliminar cuaderno
                        </button>
                        <button class="btn btn-guardar" type="button">
                            <img class="btnIcon" src="{{url_for('static', filename='img/icons/guardarCuadernoIcon.png')}}" alt="">
                            Guardar Cuaderno
                        </button>

                        <div id="menuDesplegable" class="menu-desplegable">
                            <ul>
                                {% for cuaderno in cuadernos %}
                                    <li>{{ cuaderno.nombreCuaderno }}</li>
                                {% endfor %}
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <div class="newNotebookWindow" id="newNotebookWindow">
        <div id="newNotebookContent">
            <h2>¡Crea un nuevo Cuaderno!</h2>
            <form action="/cuaderno" method="POST" id="formBody2">
                <label for="nombreCuaderno">Nombre del Cuaderno:</label>
                <input class="inputText" type="text" id="nombreCuaderno" aria-describedby="text" name="nombreCuaderno" required>

                <div id="newNotebookWindowButtons">
                    <button id="formButtonAccept" type="submit">ACEPTAR</button>
                    <button id="formButtonDecline" type="button" onclick="ocultarVentana('newNotebookWindow')">CANCELAR</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Siempre modo oscuro — un solo init, un solo skin, sin CSS aparte.
            tinymce.init({
                selector: '#mytextarea',
                plugins: "lists",
                height: "100%",
                resize: false,
                toolbar: 'undo redo | styles | bold italic underline | alignleft aligncenter alignright alignjustify | fontfamily fontsizeinput fontsize forecolor | link image | bullist numlist',
                skin: 'oxide-dark',
                content_css: 'dark'
            });
        });
    </script>
    <script src="{{url_for('static', filename='js/gestorCuaderno.js')}}"></script>
</body>
</html>
